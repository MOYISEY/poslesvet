name: Verify and deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test Python model
        run: python -m unittest discover -s core -p 'test_*.py'
      - name: Install verified official Godot and web template
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo '/tmp/godot' >> "$GITHUB_PATH"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/templates.tpz' | sha256sum -c -
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j /tmp/templates.tpz templates/web_nothreads_release.zip -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Verify engine model, controller and persistence
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/verify_core.gd
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/verify_session.gd -- --qa
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/verify_progress.gd -- --qa
      - name: Build browser game
        run: |
          mkdir -p build/web
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release 'Web Local' build/web/index.html
          printf '{"commit":"%s","version":"0.2.0"}\n' "$GITHUB_SHA" > build/web/build.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
